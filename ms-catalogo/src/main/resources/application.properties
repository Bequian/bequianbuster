spring.application.name=ms-catalogo
server.port=8082

# ===== Lineamiento: conexión a Oracle Autonomous DB con wallet =====
# Las credenciales SIEMPRE se leen desde variables de entorno.
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:ntflny1cififighx_tp}?TNS_ADMIN=${TNS_ADMIN}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ===== Lineamiento: JPA solo valida, las tablas se crean con scripts SQL =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false