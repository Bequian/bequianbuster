# Nginx para BequianBuster:
#  1) Sirve la aplicación Angular compilada (SPA).
#  2) Reenvía /api/... a los microservicios por la red Docker.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # /api/videojuegos/videojuego  →  http://ms-videojuegos:8080/videojuego
    location /api/videojuegos/ {
        proxy_pass http://ms-videojuegos:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/usuarios/auth/login  →  http://ms-usuarios:8081/auth/login
    location /api/usuarios/ {
        proxy_pass http://ms-usuarios:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (/catalogo, /videojuego/3, /login...):
    # si no existe un archivo con ese nombre, se entrega index.html
    # y el router de Angular resuelve la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}